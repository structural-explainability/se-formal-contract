# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and export executable.

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "SEFormalContract"
version = "0.2.0"
license = "MIT"

keywords = [
  "structural-explainability",
  "formal-contract",
  "neutrality",
  "identity-regimes",
  "invariants",
  "formal-specification",
  "formal-verification",
  "theorem-proving",
  "lean4",
]

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SEFormalContract"]

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# Downstream Lean projects import this library root.
# Lake discovers modules under the matching source directory.

[[lean_lib]]
name = "SEFormalContract"

# ============================================================
# EXECUTABLES
# ============================================================
# Export executables generate machine-readable contract artifacts.

[[lean_exe]]
name = "export_contract"
root = "Main"

# ============================================================
# TEST LIBRARIES
# ============================================================
# Test libraries are internal and are not part of the public import surface.

[[lean_lib]]
name = "TestImport"
srcDir = "test"

[[lean_lib]]
name = "TestExport"
srcDir = "test"
